name: Build 365d Session Image

on:
  push:
    branches:
      - master
    paths:
      - 'kernel/model/session.go'
      - 'app/appearance/langs/**'
      - 'Dockerfile.custom'
      - '.github/workflows/docker-365d.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build kernel binary (365d)
        run: |
          docker run --rm -v "$(pwd):/siyuan" -w /siyuan/kernel \
            golang:1.25-alpine sh -c "
              apk add --no-cache gcc musl-dev
              go env -w GO111MODULE=on
              go env -w CGO_ENABLED=1
              go mod download
              go build -tags fts5 -ldflags '-s -w' -o /siyuan/kernel_custom
            "
          ls -lh kernel_custom
          file kernel_custom

      - name: Prepare image name (lowercase)
        id: lower
        run: |
          echo "image=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT
          echo "version=$(jq -r .version app/package.json)" >> $GITHUB_OUTPUT

      - name: Build and push 365d image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.custom
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.lower.outputs.image }}:v${{ steps.lower.outputs.version }}-365d-session
            ${{ steps.lower.outputs.image }}:latest-365d
          cache-from: type=gha
          cache-to: type=gha,mode=max
